[project]
name = "titanbox"
version = "1.0.0"
description = "Production-hardened Telegram control plane with durable storage, PostgreSQL and cold-start resilience"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
