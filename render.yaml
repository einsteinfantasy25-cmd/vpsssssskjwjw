services:
  - type: web
    name: titanbox
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: LOG_LEVEL
        value: INFO
      - key: ENABLE_TERMINAL
        value: "false"
      - key: ENABLE_RUNNER
        value: "false"

      # Public attack-surface defaults
      - key: ADMIN_API_ENABLED
        value: "false"
      - key: PUBLIC_STATUS_DETAILS
        value: "false"
      - key: METRICS_PUBLIC
        value: "false"

      # Hard isolation guard: keep this service as a control plane only.
      - key: CONTROL_PLANE_ONLY
        value: "true"
      - key: MAX_BOTS_PER_RUNTIME
        value: "1"

      # Telegram control plane
      - key: AUTO_REGISTER_WEBHOOKS
        value: "true"
      - key: WEBHOOK_WATCHDOG_ENABLED
        value: "true"
      - key: WEBHOOK_REGISTER_BACKGROUND
        value: "true"
      - key: WAKE_ENDPOINT_ENABLED
        value: "true"
      - key: WEBHOOK_WATCHDOG_INTERVAL_SECONDS
        value: "300"
      - key: BOTS_JSON
        value: '[{"name":"deploy-admin","token_env":"DEPLOY_BOT_TOKEN","plugin":"titanbox.plugins.deploy_admin:DeployAdminPlugin","allowed_updates":["message"],"limits":{"max_inflight":4,"rate_per_minute":300,"burst":30,"handler_timeout_seconds":15}}]'
      - key: DEPLOY_BOT_TOKEN
        sync: false
      - key: WEBHOOK_SECRET_KEY
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: AUDIT_HMAC_KEY
        generateValue: true
      - key: RELEASE_SIGNING_KEY
        generateValue: true

      # Resource containment
      - key: TELEGRAM_MAX_CONNECTIONS
        value: "5"
      - key: WEBHOOK_MAX_INFLIGHT
        value: "16"
      - key: WEBHOOK_MAX_BODY_BYTES
        value: "1000000"
      - key: BOT_DEFAULT_MAX_INFLIGHT
        value: "8"
      - key: BOT_DEFAULT_RATE_PER_MINUTE
        value: "600"
      - key: BOT_DEFAULT_BURST
        value: "50"
      - key: BOT_FAILURE_THRESHOLD
        value: "5"
      - key: BOT_FAILURE_WINDOW_SECONDS
        value: "60"
      - key: BOT_FAILURE_COOLDOWN_SECONDS
        value: "30"
      - key: MEMORY_PRESSURE_LIMIT_PCT
        value: "88"

      # Persistence provider credentials/toggles are intentionally NOT managed here.
      # Add STORAGE_BACKEND/S3_* and POSTGRES_DSN manually in Render when ready, so a
      # later Blueprint sync cannot silently reset an operator's persistence settings.

      # Deploy Admin
      - key: DEPLOY_ROOT
        value: /workspace/titanbox-data
      - key: DEPLOY_ADMIN_RATE_PER_MINUTE
        value: "60"
      - key: DEPLOY_ADMIN_RATE_BURST
        value: "15"
      - key: AUDIT_LOG_PATH
        value: /workspace/titanbox-data/audit/audit.jsonl
