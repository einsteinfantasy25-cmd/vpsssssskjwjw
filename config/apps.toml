# Legacy Runner examples. Disabled by default.
# For hard security isolation use a separate service/container, not only a child process.
# Never store tokens/passwords inside this file; use env_passthrough.

[[apps]]
name = "dummy-worker"
enabled = false
command = ["python", "-u", "/app/examples/dummy_worker.py"]
restart = "on-failure"
max_restarts = 5
restart_window_seconds = 300
backoff_base_seconds = 1.0
backoff_max_seconds = 30.0
max_open_files = 256
# Optional best-effort Linux limits. 0 means disabled.
max_memory_mb = 0
max_file_bytes = 0
nice = 5

