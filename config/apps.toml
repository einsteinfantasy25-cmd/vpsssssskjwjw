# Legacy Runner examples. Disabled by default.
# Prefer the shared Telegram Hub for your own bots because it uses much less RAM.

[[apps]]
name = "dummy-worker"
enabled = false
command = ["python", "-u", "/app/examples/dummy_worker.py"]
restart = "on-failure"
max_restarts = 5
restart_window_seconds = 300
backoff_base_seconds = 1.0
backoff_max_seconds = 30.0
max_open_files = 256
nice = 5

